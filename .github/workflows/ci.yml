name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A branch named lane/<key> is one remote builder's game in progress. It gets
# the check job alone, and a newer push cancels the run before it: a wave has
# many such branches pushing often, and the lead runs the audits, the lab and
# the education checks on the merged tree.
jobs:
  check:
    runs-on: ubuntu-latest
    concurrency:
      group: check-${{ github.ref }}
      cancel-in-progress: ${{ startsWith(github.ref_name, 'lane/') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: Vitest
        run: npm test
      - name: Egress check (source)
        run: npm run egress:check
      - name: Wordless check (no text on the kid side)
        run: npm run wordless:check
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # compound-cli pinned to a commit on main until it is on npm; audit needs no key.
      - name: Compound docs audit (docs/solutions frontmatter)
        run: bunx --bun github:kieranklaassen/compound-cli#5a030ae4fa263b9a5189a39ca9d5567ef77dead2 audit --strict
      - name: Build
        run: npm run build
      - name: Egress check (built assets)
        run: npm run egress:built
      - name: Education pack check (built assets)
        run: npm run education:built

  # Plays every game's production build headless and fails on pieces passing
  # through each other (scripts/jam-intersections.mjs). Games are dealt to the
  # shards by name, so a new game needs no change here.
  intersections:
    name: Intersection audit (${{ matrix.shard }}/4)
    if: ${{ !startsWith(github.ref_name, 'lane/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    concurrency:
      group: intersections-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Playwright Chromium
        run: npx playwright install --with-deps --only-shell chromium
      - name: Build
        run: npm run build
      - name: Intersection audit
        run: npm run check:intersections -- --all --ci --shard ${{ matrix.shard }}/4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intersections-${{ matrix.shard }}
          path: test-results/intersections
          retention-days: 14

  # The mechanic prototype lab (lab/) has its own typecheck, tests, and build.
  # It shares nothing with the jam's checks above.
  lab:
    name: Mechanic lab
    if: ${{ !startsWith(github.ref_name, 'lane/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lab typecheck and tests
        run: npm run lab:check
      - name: Lab build
        run: npm run lab:build

  # The education pack (education/) has its own typecheck and tests. It is a
  # development-time reference; the check job above proves none of it is built.
  # The second step reads the real tree without the wording store: no record
  # stale or unchecked, every frame as generated, the coverage report fresh.
  education:
    name: Education pack
    if: ${{ !startsWith(github.ref_name, 'lane/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Education typecheck and tests
        run: npm run education:check
      - name: Education tree (second check, frames, coverage report)
        run: npm run education:tree
