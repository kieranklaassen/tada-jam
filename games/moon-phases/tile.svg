<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff1c9" stop-opacity="0.5"/><stop offset="1" stop-color="#fff1c9" stop-opacity="0"/></radialGradient>
    <radialGradient id="lit" cx="0.72" cy="0.38" r="0.75"><stop offset="0" stop-color="#fffaf0"/><stop offset="0.6" stop-color="#e9e0cc"/><stop offset="1" stop-color="#b9ad96"/></radialGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff6d2"/><stop offset="0.45" stop-color="#ffd46e"/><stop offset="1" stop-color="#ff9d3c" stop-opacity="0"/></radialGradient>
    <radialGradient id="earth" cx="0.35" cy="0.35" r="0.7"><stop offset="0" stop-color="#7fc2f0"/><stop offset="1" stop-color="#2a5fa8"/></radialGradient>
    <clipPath id="moon"><circle cx="50" cy="48" r="25"/></clipPath>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="2.4" flood-color="#050a24" flood-opacity="0.5"/></filter>
  </defs>
  <g fill="#ffffff"><circle cx="16" cy="18" r="0.9"/><circle cx="84" cy="80" r="0.8"/><circle cx="20" cy="74" r="0.7"/><circle cx="72" cy="12" r="0.7"/><circle cx="90" cy="40" r="0.6"/></g>
  <circle cx="88" cy="16" r="16" fill="url(#sun)"/>
  <ellipse cx="50" cy="56" rx="42" ry="14" fill="none" stroke="#e8bf66" stroke-width="1.6" stroke-dasharray="3 3" opacity="0.8"/>
  <circle cx="50" cy="48" r="34" fill="url(#glow)"/>
  <g filter="url(#soft)">
    <circle cx="50" cy="48" r="25" fill="#2c3558"/>
    <g clip-path="url(#moon)">
      <!-- The sunlit half faces the sun at top right. -->
      <path d="M50 23a25 25 0 0 1 0 50a13 25 0 0 0 0-50Z" fill="url(#lit)"/>
      <g fill="#a99d86" opacity="0.55"><circle cx="61" cy="38" r="4"/><circle cx="66" cy="55" r="2.6"/><circle cx="55" cy="62" r="3.2"/><circle cx="68" cy="45" r="1.6"/></g>
      <g fill="#3a4468" opacity="0.8"><circle cx="38" cy="40" r="3.4"/><circle cx="34" cy="58" r="2.4"/></g>
    </g>
    <circle cx="50" cy="48" r="25" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1"/>
  </g>
  <!-- Earth and its small watcher on the near side of the orbit. -->
  <circle cx="24" cy="66" r="8" fill="url(#earth)"/>
  <path d="M19 63c3-1 4 2 7 1s3 3 1 4-5 0-6-1-3-2-2-4Z" fill="#5fae62"/>
  <path d="M24 58v-3" stroke="#e0553d" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="24" cy="54" r="1.4" fill="#f0c29a"/>
</svg>
