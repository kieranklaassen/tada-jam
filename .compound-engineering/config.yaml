# Compound Engineering config. The `compound:` block is read only by
# compound-cli (https://github.com/kieranklaassen/compound-cli), which audits
# the learnings under docs/solutions/ in CI and recalls them before work.
compound:
  schema:
    fields:
      applies_when:
        required: true
        max_items: 5
  audit:
    strict: true

# Compound Packs: prescriptive knowledge that the Compound Engineering
# brainstorm, plan and review skills read on their own and cite as
# `(pack: <id>, <file>)`. One entry per pack.
packs:
  - source: compound-packs/game-design
  - source: education
